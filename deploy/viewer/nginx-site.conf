# Fork-only (FORK_CHANGES.md): the viewer behind an nginx that already serves
# other sites. Replace learn.example.com with your subdomain (its DNS record
# must point at this server) and 3000 with the service's PORT, then:
#   sudo cp nginx-site.conf /etc/nginx/sites-available/learn.example.com
#   sudo ln -s /etc/nginx/sites-available/learn.example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d learn.example.com --redirect
server {
    listen 80;
    listen [::]:80;
    server_name learn.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Class chat and course updates stream their answers.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
